# Reducido a propósito (12-sep-2026): mismo patrón que el proyecto anterior
# (Ticketti/MS-FULLSTACK) — el resto de la configuración (datasource, JPA,
# Cognito, mail, Eureka, contacto, ms-mascotas.base-url) vive en
# sanos-y-salvos-config_server/config/ms-alertas.yml, no acá. Antes este
# archivo tenía todo local ADEMÁS de apuntar al config-server, así que el
# config-server no cumplía ningún rol real para este servicio.
spring:
  # Carga variables desde el archivo .env en la raíz del proyecto (formato
  # KEY=VALOR), si existe — así no hace falta exportarlas a mano en local.
  # "optional:" evita que falle si el archivo no está (ej. en CI, donde las
  # variables reales vienen del entorno de despliegue, no de un .env).
  config:
    import: "optional:file:.env[.properties],optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: ms-alertas
