services:
  mysql:
    image: mysql:8.4
    container_name: ms-alertas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: alertas_db
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ms-alertas-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sanos-y-salvos-network

  ms-alertas:
    build: .
    container_name: ms-alertas
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sanos-y-salvos-network
    environment:
      PORT: 8083
      # En local/Docker se usa el MySQL del servicio de arriba. En AWS, estas
      # mismas variables se sobrescriben en el despliegue apuntando al RDS real.
      DB_URL: "jdbc:mysql://mysql:3306/alertas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      # sin esto quedaba en el default (localhost:8082, el propio contenedor)
      # y la resolución de contacto contra ms-mascotas fallaba siempre
      MS_MASCOTAS_BASE_URL: http://ms-mascotas:8082

volumes:
  ms-alertas-mysql-data:

networks:
  sanos-y-salvos-network:
    external: true
    name: sanos-y-salvos-network
