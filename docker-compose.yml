services:
  mysql:
    image: mysql:8.4
    container_name: ms-alertas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: alertas_db
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ms-alertas-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sanos-y-salvos-network

  localstack:
    image: localstack/localstack:3
    container_name: ms-alertas-localstack
    restart: unless-stopped
    environment:
      SERVICES: sns,sqs
    ports:
      - "4566:4566" # edge port: aca se ven los recursos con awslocal / la consola web
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sanos-y-salvos-network

  ms-alertas:
    build: .
    container_name: ms-alertas
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8083' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sanos-y-salvos-network
    environment:
      PORT: 8083
      # mismo prefijo que ms-mascotas, para que el bff pueda reenviar la ruta
      # completa sin tener que saber cual MS usa prefijo y cual no
      SPRING_MVC_SERVLET_PATH: /api/v1
      # En local/Docker se usa el MySQL del servicio de arriba. En AWS, estas
      # mismas variables se sobrescriben en el despliegue apuntando al RDS real.
      DB_URL: "jdbc:mysql://mysql:3306/alertas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      MS_MASCOTAS_BASE_URL: http://ms-mascotas:8082
      # LocalStack en vez de AWS real: no depende de la sesion del lab para
      # probar la mensajeria local. En AWS estas variables se sobrescriben
      # (ver terraform/locals.tf) y AWS_ENDPOINT_OVERRIDE queda vacio.
      AWS_REGION: us-east-1
      AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:sanos-eventos
      SQS_COLA_CONTACTO_URL: http://localstack:4566/000000000000/cola-contacto
      SQS_COLA_MASCOTA_REPORTADA_URL: http://localstack:4566/000000000000/cola-mascota-reportada
      SQS_COLA_MASCOTA_REUNIFICADA_URL: http://localstack:4566/000000000000/cola-mascota-reunificada

volumes:
  ms-alertas-mysql-data:

networks:
  sanos-y-salvos-network:
    external: true
    name: sanos-y-salvos-network
